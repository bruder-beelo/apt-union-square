name: Check 1 Bedroom Availability

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check apartment availability
        id: check
        run: |
          python check_availability.py > output.txt 2>&1 || true
          cat output.txt
          if grep -q "✅ Found" output.txt; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue if apartment available
        if: steps.check.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🏠 1 Bedroom Apartment Available at Union 346!';
            const body = `## Great news! A 1 bedroom apartment is now available! 🎉

            **Action Required:** Check the apartment details and apply ASAP!

            ### Links
            - 🏢 [View Floorplans](https://www.union346.com/floorplans)
            - 📊 [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Next Steps
            1. Visit the Union 346 website
            2. Review the available 1 bedroom unit
            3. Contact them to schedule a tour
            4. Apply if interested!

            ---
            *This issue was automatically created by the apartment availability checker.*
            *Generated at: ${new Date().toLocaleString('en-US', { timeZone: 'America/New_York' })}*`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'apartment-available'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['apartment-available', 'alert']
              });
              console.log('✅ Created new issue for available apartment');
            } else {
              console.log('ℹ️ Issue already exists - not creating duplicate');
            }
