name: Check 1 Bedroom Availability

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check apartment availability
        id: check
        run: |
          python check_availability.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Send email notification if available
        if: steps.check.outputs.exit_code == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🏠 1 Bedroom Apartment Available at Union 346!'
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Union 346 Apartment Checker
          body: |
            Great news! A 1 bedroom apartment is now available at Union 346.

            Check the GitHub Actions run for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Visit the website:
            https://www.union346.com/floorplans
          priority: high
