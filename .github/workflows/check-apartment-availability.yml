name: Check 1 Bedroom Availability

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-availability:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check apartment availability
        id: check
        run: |
          python check_availability.py > output.txt 2>&1 || true
          cat output.txt
          if grep -q "✅ Found" output.txt; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issues for each available apartment
        if: steps.check.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('output.txt', 'utf8');

            // Extract JSON from output
            const jsonMatch = output.match(/__UNITS_JSON__\n(.*?)\n__END_JSON__/s);
            if (!jsonMatch) {
              console.log('⚠️ Could not parse units JSON from output');
              return;
            }

            const units = JSON.parse(jsonMatch[1]);
            console.log(`Found ${units.length} available unit(s)`);

            // Get all existing open issues with apartment-available label
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'apartment-available'
            });

            // Extract unit numbers from existing issue titles
            const existingUnitNumbers = existingIssues.data.map(issue => {
              const match = issue.title.match(/UNIT\s+[\w-]+/);
              return match ? match[0] : null;
            }).filter(Boolean);

            console.log(`Existing issues for units: ${existingUnitNumbers.join(', ') || 'none'}`);

            // Create an issue for each unit that doesn't have one
            for (const unit of units) {
              const unitId = unit.unit_number;

              if (existingUnitNumbers.includes(unitId)) {
                console.log(`ℹ️ Issue already exists for ${unitId} - skipping`);
                continue;
              }

              const title = `🏠 ${unitId} Available - ${unit.type}`;
              const timestamp = new Date().toLocaleString('en-US', { timeZone: 'America/New_York' });

              const body = [
                '## Great news! A 1 bedroom apartment is now available! 🎉',
                '',
                '**Unit Details:**',
                `- **Unit Number:** ${unitId}`,
                `- **Type:** ${unit.type}`,
                `- **Price:** ${unit.price}`,
                `- **Available:** ${unit.available_on}`,
                '',
                '**Action Required:** Check the apartment details and apply ASAP!',
                '',
                '### Links',
                '- 🏢 [View Floorplans](https://www.union346.com/floorplans)',
                '- 📊 [View this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})',
                '',
                '### Next Steps',
                '1. Visit the Union 346 website',
                `2. Review unit ${unitId}`,
                '3. Contact them to schedule a tour',
                '4. Apply if interested!',
                '',
                '---',
                '*This issue was automatically created by the apartment availability checker.*',
                `*Generated at: ${timestamp}*`
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['apartment-available', 'alert', unitId]
              });

              console.log(`✅ Created issue for ${unitId}`);
            }
